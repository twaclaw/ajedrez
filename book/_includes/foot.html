<script type="module">
// One initialiser for the whole book. A game page carries a board div with its
// PGN inside, and a JSON blob holding the moves and the notes keyed to them;
// the wiring between the two lives here, so a change lands on every chapter
// at once.
// Quarto resolves the link in the head for the depth of the page; a path
// written here it would leave alone.
const { default: LichessPgnViewer } =
  await import(document.getElementById('lpv-module').href);
const { attach, initPieces } =
  await import(document.getElementById('board-module').href);

initPieces();

function wire(boardEl) {
  const src = boardEl.querySelector('script[type="text/pgn"]');
  if (!src || boardEl.dataset.mounted) return;
  boardEl.dataset.mounted = '1';

  const host = document.createElement('div');
  boardEl.appendChild(host);

  const lpv = LichessPgnViewer(host, {
    pgn: src.textContent,
    showPlayers: false,
    showClocks: false,
    showMoves: false,
    showControls: true,
    scrollToMove: false,
    keyboardToMove: true,
    orientation: boardEl.dataset.orientation || 'white',
    drawArrows: false,
    lichess: false,
    menu: { getPgn: { enabled: true } }
  });

  // With no move list on the page the control bar is the only way through a
  // game, which is a long way round in a game of 136 moves, so the ends of it
  // are offered too -- in the menu rather than the row, named rather than
  // drawn, because a child reads "Go to the start" sooner than a pair of
  // chevrons, and because the row is kept to the two steps that matter.
  //
  // The viewer builds that menu afresh every time it is opened, so the entries
  // are added as it appears rather than once at mount.
  const viewer = boardEl.querySelector('.lpv');
  if (viewer) {
    const ends = [['first', 'Go to the start'], ['last', 'Go to the end']];
    new MutationObserver(() => {
      const menu = viewer.querySelector(':scope > .lpv__menu');
      if (!menu || menu.querySelector('.lpv-end')) return;
      // Above the viewer's own entries: moving about the game is what a reader
      // opens the menu for, and flipping the board is not.
      menu.prepend(...ends.map(([where, label]) => {
        const btn = document.createElement('button');
        btn.className = 'lpv__menu__entry lpv__fbt lpv-end';
        btn.textContent = label;
        // Moving to a move puts the viewer back on the board itself, so the
        // menu closes behind the jump without being told to.
        btn.addEventListener('click', () => lpv.goTo(where));
        return btn;
      }));
    }).observe(viewer, { childList: true });
  }

  // The viewer binds the left and right arrows itself; these are the two it
  // leaves, and they reach the ends of the game without opening the menu.
  boardEl.addEventListener('keydown', e => {
    const to = (e.key === 'Home' || e.key === 'ArrowUp') ? 'first'
             : (e.key === 'End' || e.key === 'ArrowDown') ? 'last' : null;
    if (!to) return;
    e.preventDefault();
    lpv.goTo(to);
  });

  const column = boardEl.parentElement;
  const blob = column.querySelector('script.game-data');
  const panel = column.querySelector('.move-text');
  if (!blob || !panel) return;
  const game = JSON.parse(blob.textContent);

  // Guessing and exploring both start from whatever the viewer is showing, so
  // the playable board is handed the viewer rather than the page.
  const sandbox = attach({ boardEl, lpv, game });

  const box = panel.querySelector('.move-text__move');
  const out = panel.querySelector('.move-text__notes');

  // The move being shown, named as a game score names it, with whatever note
  // belongs to it. There is no move list on the page, so this is where a
  // reader finds both.
  function show() {
    // Path.size() is the number of plies played, so the ply now on the board
    // is one less than that, and a size of 0 is the opening position.
    const i = lpv.path.size() - 1;
    box.textContent = '';
    if (i < 0 || i >= game.san.length) {
      box.textContent = 'The opening position.';
    } else {
      const tag = document.createElement('span');
      tag.className = 'move-text__no';
      tag.textContent = (Math.floor(i / 2) + 1) + (i % 2 ? '... ' : '. ');
      box.appendChild(tag);
      box.appendChild(document.createTextNode(game.san[i]));
      const mark = game.marks[i];
      if (mark) {
        const m = document.createElement('span');
        m.className = 'mark';
        m.textContent = mark;
        box.appendChild(m);
      }
    }
    out.textContent = '';
    (game.notes[i] || []).forEach(note => {
      const p = document.createElement('p');
      p.textContent = note.text;
      if (note.by) {
        const by = document.createElement('span');
        by.className = 'move-text__by';
        by.textContent = ' — ' + note.by;
        p.appendChild(by);
      }
      out.appendChild(p);
    });
    panel.classList.toggle('has-note', out.childElementCount > 0);
    panel.scrollTop = 0;
    // Whether there is a move left to guess follows from where the viewer is.
    sandbox.refresh();
  }

  // Every navigation -- click, keyboard, the controls -- funnels through
  // toPath, so wrapping it is enough to follow the board wherever it goes.
  const toPath = lpv.toPath;
  lpv.toPath = function (path, focus) {
    toPath.call(lpv, path, focus);
    show();
  };

  show();
}

function mount() {
  document.querySelectorAll('.pgn-board').forEach(wire);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', mount);
} else {
  mount();
}
</script>
